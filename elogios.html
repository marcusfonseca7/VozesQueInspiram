<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vozes que Inspiram | SENAI Anchieta - Vila Mariana</title>

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/elogios.css" />

    <link rel="shortcut icon" href="img/bonequinho.png" type="image/x-icon">
  </head>
  <body>
    <!-- ---------------------- HEADER ---------------------- -->
    <header class="header elogios" style="position: static">
      <div class="header__logos">
        <img
          src="img/logoSenai.jpeg"
          alt="Logo SENAI"
          class="header__logo header__logo--senai"
        />
        <span class="header__divider"></span>
        <img
          src="img/logoPertencerNomeBranco.png"
          alt="Logo Rede Pertencer"
          class="header__logo header__logo--pertencer"
        />
      </div>

      <button
        id="abrirMenu"
        class="menu-button"
        type="button"
        aria-label="Abrir menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <dialog id="menuDialog" class="menu-dialog">
        <aside class="menu-dialog__container">
          <button
            id="fecharMenu"
            class="menu-dialog__close"
            type="button"
            aria-label="Fechar menu"
          >
            ×
          </button>

          <nav class="menu-dialog__nav">
            <ul class="menu-dialog__list">
              <li class="menu-dialog__item">
                <a href="index.html" class="menu-dialog__link"> HOME </a>
              </li>

              <li class="menu-dialog__item">
                <a href="reconhecimento.html" class="menu-dialog__link">
                  RECONHECIMENTO
                </a>
              </li>

              <li class="menu-dialog__item">
                <a href="elogios.html" class="menu-dialog__link ativo">
                  ELOGIOS
                </a>
              </li>
            </ul>
          </nav>
        </aside>
      </dialog>
    </header>

    <main>
      <section
        class="historico-elogios__navegacao"
        aria-label="Navegação por mês"
      >
        <button
          type="button"
          id="mesAnterior"
          class="historico-elogios__seta"
          aria-label="Ver mês anterior"
        >
          <img src="img/iconSetaEsquerda.png" alt="Seta para esquerda" />
        </button>
        <div class="historico-elogios__mes-container">
          <h2 id="mesAtual">Carregando...</h2>
          <span id="totalElogios" aria-live="polite"></span>
        </div>
        <button
          type="button"
          id="proximoMes"
          class="historico-elogios__seta"
          aria-label="Ver próximo mês"
        >
          <img src="img/iconSetaDireita.png" alt="Seta para direita" />
        </button>
      </section>
      <section
        id="elogiosHistorico"
        class="historico-elogios__lista"
        aria-live="polite"
      >
        <p class="historico-elogios__estado">Carregando elogios...</p>
      </section>
    </main>

    <!-- ---------------------- FOOTER ---------------------- -->
    <footer class="footer">
      <div class="footer__background"></div>

      <div class="footer__content">
        <div class="footer__realizacao">
          <span class="footer__realizacao-label">Realização:</span>
          <img
            src="img/logoSenai.jpeg"
            alt="Logo SENAI"
            class="footer__logo senai"
          />
          <span class="footer__divider"></span>
          <img
            src="img/logoPertencerNomeBranco.png"
            alt="Logo Rede Pertencer"
            class="footer__logo pertencer"
          />
        </div>

        <div class="footer__info">
          <p class="footer__info-text">SENAI "Anchieta" - Vila Mariana</p>
          <p class="footer__info-text footer__info-text--bold">
            Todos os direitos reservados - 2026
          </p>
        </div>
      </div>
    </footer>
    <script type="module" src="./js/pages/elogios.js"></script>
  </body>
</html>
