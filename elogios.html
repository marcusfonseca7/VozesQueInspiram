<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vozes que Inspiram | SENAI Anchieta - Vila Mariana</title>

    <link rel="stylesheet" href="./css/style.css" />

    <link rel="stylesheet" />
  </head>
  <body>
    <!-- ---------------------- HEADER ---------------------- -->
    <header class="header" style="position: static">
      <div class="header__logos">
        <img
          src="img/logoSenai.jpeg"
          alt="Logo SENAI"
          class="header__logo header__logo--senai"
        />
        <span class="header__divider"></span>
        <img
          src="img/logoPertencerNomeBranco.png"
          alt="Logo Rede Pertencer"
          class="header__logo header__logo--pertencer"
        />
      </div>

      <nav class="header__nav">
        <ul class="header__nav-list">
          <li class="header__nav-item">
            <a href="index.html" class="header__nav-link">HOME</a>
          </li>
          <li class="header__nav-item">
            <a href="#" class="header__nav-link">ELOGIOS</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="elogios-container">
        <h2 class="elogios-title">Elogios</h2>
        <div class="elogios-list" id="elogiosList"></div>
      </div>
    </main>

    <!-- ---------------------- FOOTER ---------------------- -->
    <footer class="footer">
      <div class="footer__background"></div>

      <div class="footer__content">
        <div class="footer__realizacao">
          <span class="footer__realizacao-label">Realização:</span>
          <img
            src="img/logoSenai.jpeg"
            alt="Logo SENAI"
            class="footer__logo senai"
          />
          <span class="footer__divider"></span>
          <img
            src="img/logoPertencer.png"
            alt="Logo Rede Pertencer"
            class="footer__logo pertencer"
          />
        </div>

        <div class="footer__info">
          <p class="footer__info-text">SENAI "Anchieta" - Vila Mariana</p>
          <p class="footer__info-text footer__info-text--bold">
            Todos os direitos reservados - 2026
          </p>
        </div>
      </div>
    </footer>

    <dialog id="dialogElogios">
      <button id="fecharDialog" type="button">×</button>

      <h2 id="dialogTitulo"></h2>

      <div id="dialogConteudo"></div>
    </dialog>

    <script type="module" src="./js/pages/elogios.js"></script>
  </body>
</html>
